name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: src/AdjacentPairCounter.slnx
  IMAGE_NAME: adjacentpaircounter-api

jobs:
  build-test-push:
    name: Build, Test, Push to ACR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --no-build --configuration Release

      - name: Compute image tag
        id: vars
        run: echo "image_tag=${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          ACR_NAME="${{ vars.ACR_LOGIN_SERVER }}"
          az acr login --name "${ACR_NAME%%.*}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vm:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build-test-push
    env:
      IMAGE_TAG: ${{ needs.build-test-push.outputs.image_tag }}
    steps:
      - name: Deploy over SSH with health check and rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            ACR_LOGIN_SERVER="${{ vars.ACR_LOGIN_SERVER }}"
            ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            NEW_TAG="$IMAGE_TAG"
            CONTAINER_NAME="apc-api"
            PREV_TAG_FILE="$HOME/current_tag.txt"

            az login --identity --output none
            az acr login --name "$ACR_NAME" --output none

            docker pull "$ACR_LOGIN_SERVER/$IMAGE_NAME:$NEW_TAG"

            PREV_TAG=""
            if [ -f "$PREV_TAG_FILE" ]; then
              PREV_TAG=$(cat "$PREV_TAG_FILE")
            fi

            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true

            docker run -d --name "$CONTAINER_NAME" -p 8080:8080 --restart unless-stopped \
              "$ACR_LOGIN_SERVER/$IMAGE_NAME:$NEW_TAG"

            echo "Waiting for health check..."
            HEALTHY=false
            for i in $(seq 1 10); do
              sleep 3
              if curl -sf http://localhost:8080/healthz > /dev/null; then
                HEALTHY=true
                break
              fi
            done

            if [ "$HEALTHY" = "true" ]; then
              echo "$NEW_TAG" > "$PREV_TAG_FILE"
              echo "Deployment succeeded: $NEW_TAG"
              docker image prune -f
            else
              echo "Health check failed, rolling back"
              docker stop "$CONTAINER_NAME" || true
              docker rm "$CONTAINER_NAME" || true
              if [ -n "$PREV_TAG" ]; then
                docker run -d --name "$CONTAINER_NAME" -p 8080:8080 --restart unless-stopped \
                  "$ACR_LOGIN_SERVER/$IMAGE_NAME:$PREV_TAG"
                echo "Rolled back to $PREV_TAG"
              fi
              exit 1
            fi
