name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: src/AdjacentPairCounter.slnx
  IMAGE_NAME: adjacentpaircounter-api

jobs:
  build-test-push:
    name: Build, Test, Push to ACR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --no-build --configuration Release

      - name: Compute image tag
        id: vars
        run: echo "image_tag=${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          ACR_NAME="${{ vars.ACR_LOGIN_SERVER }}"
          az acr login --name "${ACR_NAME%%.*}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to AKS (dev)
    runs-on: ubuntu-latest
    needs: build-test-push
    environment: dev
    env:
      IMAGE_TAG: ${{ needs.build-test-push.outputs.image_tag }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group rg-apc-learn --name aks-apc --admin --overwrite-existing

      - name: Roll out new image
        run: |
          kubectl set image deployment/apc-api apc-api="${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" -n apc-dev
          kubectl rollout status deployment/apc-api -n apc-dev --timeout=120s

      - name: Roll back on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/apc-api -n apc-dev
          kubectl rollout status deployment/apc-api -n apc-dev --timeout=120s

  deploy-prod:
    name: Deploy to AKS (prod)
    runs-on: ubuntu-latest
    needs: [build-test-push, deploy-dev]
    environment: production
    env:
      IMAGE_TAG: ${{ needs.build-test-push.outputs.image_tag }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group rg-apc-learn --name aks-apc --admin --overwrite-existing

      - name: Roll out new image
        run: |
          kubectl set image deployment/apc-api apc-api="${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" -n apc-prod
          kubectl rollout status deployment/apc-api -n apc-prod --timeout=120s

      - name: Roll back on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/apc-api -n apc-prod
          kubectl rollout status deployment/apc-api -n apc-prod --timeout=120s
