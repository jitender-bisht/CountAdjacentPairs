name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: src/AdjacentPairCounter.slnx

jobs:
  build-test:
    name: Build, Test, Coverage, Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      - name: Code quality (format check)
        run: dotnet format ${{ env.SOLUTION }} --no-restore --verify-no-changes --severity warn

      - name: Test with coverage
        run: >
          dotnet test ${{ env.SOLUTION }} --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger trx

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both

      - name: Comment coverage on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Publish app output
        run: >
          dotnet publish src/AdjacentPairCounter.Api/AdjacentPairCounter.Api.csproj
          -c Release -o ./publish --no-build

      - name: Upload test & coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            **/*.trx

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: api-publish-output
          path: ./publish

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (validate only — no push from CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: adjacentpaircounter-api:${{ github.run_number }}-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
