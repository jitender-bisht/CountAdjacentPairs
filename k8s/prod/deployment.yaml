apiVersion: apps/v1
kind: Deployment
metadata:
  name: apc-api
  namespace: apc-prod
  labels:
    app: apc-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apc-api
  template:
    metadata:
      labels:
        app: apc-api
    spec:
      containers:
        - name: apc-api
          image: acrapcmlsryg.azurecr.io/adjacentpaircounter-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: apc-api-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
